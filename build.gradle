plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven { name = 'LocalMirror'; url = uri("${projectDir}/.local-repo") }
    flatDir { dirs 'libs' }
    maven { name = 'MinecraftForge'; url = uri('https://maven.minecraftforge.net') }
    maven { name = 'NeoForge'; url = uri('https://maven.neoforged.net/releases') }
    mavenCentral()
}

legacyForge {
    enable {
        forgeVersion = project.forge_version
    }
    runs {
        client {
            client()
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll '--quickPlaySingleplayer',
                        project.property('quickPlayWorld').toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
}

obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    add("modCompileOnly", "local:Mekanism-1.20.1:${mekanism_version}")
    add("modCompileOnly", "local:jei-1.20.1-forge:${jei_version}")
    add("modCompileOnly", "local:mekanism_extras-1.20.1:${mekanism_extras_version}")

    add("modLocalRuntime", "local:Mekanism-1.20.1:${mekanism_version}")
    add("modLocalRuntime", "local:MekanismGenerators-1.20.1:${mekanism_version}")
    add("modLocalRuntime", "local:occultism-1.20.1:${occultism_version}")
    add("modLocalRuntime", "local:jei-1.20.1-forge:${jei_version}")
    add("modLocalRuntime", "local:ars_nouveau-1.20.1:${ars_nouveau_version}-all")
    add("modLocalRuntime", "local:mekanism_extras-1.20.1:${mekanism_extras_version}")
    add("modLocalRuntime", "local:mekmm-1.20.1:${mekmm_version}")
    add("modLocalRuntime", 'local:modonomicon-1.20.1-forge:1.79.3')
    add("modLocalRuntime", 'local:curios-forge:5.13.0+1.20.1')
    add("modLocalRuntime", 'local:geckolib-forge-1.20.1:4.8.4')
    add("modLocalRuntime", 'local:SmartBrainLib-forge-1.20.1:1.15')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version           : forge_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
