tasks.register('validateOfflineSelfTestWiring') {
    group = 'verification'
    description = 'Fails when a source-level *SelfTest main is not wired to a JavaExec task.'
    def selfTestSources = fileTree('src/test/java') {
        include '**/*SelfTest.java'
    }
    inputs.files(selfTestSources)
    doLast {
        Set<String> expected = new TreeSet<>()
        selfTestSources.files.each { File sourceFile ->
            String source = sourceFile.getText('UTF-8')
            def packageMatch = source =~ /(?m)^\s*package\s+([A-Za-z_$][A-Za-z0-9_$.]*)\s*;/
            if (!packageMatch.find()
                    || !(source =~ /public\s+static\s+void\s+main\s*\(/).find()) {
                throw new GradleException("Offline self-test must declare a package and main method: ${project.relativePath(sourceFile)}")
            }
            String simpleName = sourceFile.name.substring(
                    0, sourceFile.name.length() - 5)
            expected << "${packageMatch.group(1)}.${simpleName}".toString()
        }
        Set<String> wired = tasks.withType(JavaExec).collect { task ->
            task.mainClass.getOrNull()
        }.findAll { it != null }.toSet()
        Set<String> missing = new TreeSet<>(expected)
        missing.removeAll(wired)
        if (!missing.isEmpty()) {
            throw new GradleException('Offline self-tests missing JavaExec/check wiring: '
                    + missing.join(', '))
        }
    }
}

