tasks.register('validatePackagedIntegrations') {
    group = 'verification'
    description = 'Verifies that enabled optional integrations are present in the packaged jar.'
    dependsOn tasks.named('jar')

    def archive = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(archive)
    inputs.property('compileMekanismExtras', compileMekanismExtras)
    inputs.property('compileMekEnergistics', compileMekEnergistics)
    inputs.property('compileAe2', compileAe2)
    inputs.property('requireFullIntegrations', requireFullIntegrations)
    def harvestDefinitions = fileTree('src/main/resources/data/mekanism_magic/drygmy_harvest') {
        include '**/*.json'
    }
    inputs.files(harvestDefinitions)

    doLast {
        boolean requireFull = requireFullIntegrations.get()
