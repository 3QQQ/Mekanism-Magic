plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)


def arsMachineContentEnabled = project.findProperty(
        'mekanism_magic.ars_machine_content')?.toString()?.toBoolean() ?: true

repositories {
    // These pinned optional APIs live on Modrinth. Do not spend minutes
    // probing unrelated mod repositories for their metadata/artifacts.
    exclusiveContent {
        forRepository {
            maven { name = 'OptionalNetworkApis'; url = uri('https://api.modrinth.com/maven') }
        }
        filter {
            includeModule('maven.modrinth', 'jade')
            includeModule('maven.modrinth', 'appflux')
            includeModule('maven.modrinth', 'glodium')
            includeModule('maven.modrinth', 'SRTE8mLr')
            includeModule('maven.modrinth', 'ordsPcFz')
            includeModule('maven.modrinth', 'ugIdhQx4')
        }
    }
    maven { name = 'LocalMirror'; url = uri("${projectDir}/.local-repo") }
    maven { name = 'NeoForge'; url = uri('https://maven.neoforged.net/releases') }
    maven { name = 'ModMaven'; url = uri('https://modmaven.dev') }
    maven { name = 'Jared'; url = uri('https://maven.blamejared.com') }
    maven {
        name = 'GeckoLib'
        url = uri('https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/')
    }
    maven {
        name = 'Modrinth'
        url = uri('https://api.modrinth.com/maven')
        content { includeGroup('maven.modrinth') }
    }
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = uri('https://cursemaven.com')
        content { includeGroup('curse.maven') }
    }
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            // Keep optional visual acceptance worlds/configs separate from the user's dev world.
            if (project.hasProperty('mekanism_magic.client_run_directory')) {
                gameDirectory = file(project.property('mekanism_magic.client_run_directory').toString())
            }
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll '--quickPlaySingleplayer',
                        project.property('quickPlayWorld').toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'mekanism_magic.ars_machine_content',
                    arsMachineContentEnabled.toString()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    if (arsMachineContentEnabled) {
        srcDir('src/arsDev/resources')
    }
}

// Jade discovers its isolated plugin only when Jade itself is installed.
// No common registration or client class links to the optional API.
sourceSets.main.java.srcDir('src/jade/java')

// Mekanism Extras is an optional binary-only integration. Keep its source out
// of release builds unless the supplied development jar is present, so a clean
// CI runner can build the core Mekanism-only artifact from public Maven repos.
def mekanismExtrasJar = file(
        "libs/mekanism_extras-1.21.1-${mekanism_extras_version}.jar")
def mekenergisticsJar = file('libs/mekenergistics-3.0.6.jar')
def mekmmJar = file("libs/mekmm-1.21.1-${mekmm_runtime_version}.jar")
def ae2Jar = file('run/mods/appliedenergistics2-19.2.17.jar')
def arsEnergistiqueJar = file(project.findProperty(
        'mekanism_magic.arseng_jar')
        ?: "libs/arseng-${ars_energistique_version}.jar")
def compileAe2Property = project.findProperty(
        'mekanism_magic.compile_ae2')
def compileAe2 = compileAe2Property == null
        ? ae2Jar.exists()
        : compileAe2Property.toString().toBoolean()
def compileMekEnergisticsProperty = project.findProperty(
        'mekanism_magic.compile_mekenergistics')
def compileMekEnergistics = compileMekEnergisticsProperty == null
        ? mekenergisticsJar.exists() && ae2Jar.exists()
        : compileMekEnergisticsProperty.toString().toBoolean()
def compileMekanismExtrasProperty = project.findProperty(
        'mekanism_magic.compile_mekextras')
def compileMekanismExtras = compileMekanismExtrasProperty == null
        ? mekanismExtrasJar.exists()
        : compileMekanismExtrasProperty.toString().toBoolean()
if (compileAe2 && !ae2Jar.isFile()) {
    throw new GradleException('AE2 integration was explicitly enabled, but '
            + "the compile jar is missing: ${ae2Jar}")
}
if (compileMekEnergistics && !mekenergisticsJar.isFile()) {
    throw new GradleException('Mek Energistics integration was explicitly '
            + "enabled, but the compile jar is missing: ${mekenergisticsJar}")
}
if (compileMekEnergistics && !compileAe2) {
    throw new GradleException('Mek Energistics integration requires the AE2 '
            + 'compile integration and its local API jar.')
}
if (compileMekanismExtras && !mekanismExtrasJar.isFile()) {
    throw new GradleException('Mekanism Extras integration was explicitly '
            + "enabled, but the compile jar is missing: ${mekanismExtrasJar}")
}
if (!compileMekanismExtras) {
    sourceSets.main.java.exclude('com/example/mekanismmagic/integration/mekextras/**')
}
if (compileMekEnergistics) {
    sourceSets.main.java.srcDir('src/mekenergistics/java')
    sourceSets.main.resources.srcDir('src/mekenergistics/resources')
}
if (compileAe2) {
    sourceSets.main.java.srcDir('src/ae2/java')
    sourceSets.main.resources.srcDir('src/ae2/resources')
} else {
    sourceSets.test.java.exclude('**/MagicResourceRenderingSelfTest.java')
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
    forbiddenReference {
        canBeConsumed = false
        canBeResolved = true
    }
}

def compatRuntimeEnabled = project.findProperty('mekanism_magic.compat_runtime')?.toString()?.toBoolean() ?: false
def occultismRuntimeEnabled = project.hasProperty('mekanism_magic.occultism_runtime')
        ? project.property('mekanism_magic.occultism_runtime').toString().toBoolean()
        : true
def mekExtrasRuntimeEnabled = compatRuntimeEnabled ||
        (project.findProperty('mekanism_magic.mekextras_runtime')?.toString()?.toBoolean() ?: false)
def mekmmRuntimeEnabled = compatRuntimeEnabled ||
        (project.findProperty('mekanism_magic.mekmm_runtime')?.toString()?.toBoolean() ?: false)
def arsRuntimeEnabled = project.findProperty('mekanism_magic.ars_runtime')?.toString()?.toBoolean() ?: false
def naturesAuraRuntimeEnabled = project.findProperty(
        'mekanism_magic.naturesaura_runtime')?.toString()?.toBoolean() ?: false
def forbiddenRuntimeEnabled = project.findProperty(
        'mekanism_magic.forbidden_runtime')?.toString()?.toBoolean() ?: false
def forbiddenCoordinate = "maven.modrinth:forbidden-arcanus:${forbidden_arcanus_maven_version}"
def valhelsiaCoordinate = "curse.maven:valhelsia-core-416935:${valhelsia_core_curse_file}"
def mekEnergisticsRuntimeEnabled = project.findProperty(
        'mekanism_magic.mekenergistics_runtime')?.toString()?.toBoolean() ?: false
def ae2RuntimeEnabled = project.findProperty(
        'mekanism_magic.ae2_runtime')?.toString()?.toBoolean() ?: false
def arsEnergistiqueRuntimeEnabled = project.findProperty(
        'mekanism_magic.arseng_runtime')?.toString()?.toBoolean() ?: false

dependencies {
    compileOnly("maven.modrinth:jade:${jade_maven_version}") { transitive = false }
    compileOnly "mekanism:Mekanism:1.21.1-${mekanism_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    compileOnly "com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:${ars_nouveau_maven_version}"
    compileOnly "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_compile_version}"
    compileOnly "maven.modrinth:natures-aura:${natures_aura_version}"
    // Pinned public artifacts, never the user's Downloads directory or jarJar.
    compileOnly(forbiddenCoordinate) { transitive = false }
    compileOnly(valhelsiaCoordinate) { transitive = false }
    forbiddenReference(forbiddenCoordinate) { transitive = false }
    forbiddenReference(valhelsiaCoordinate) { transitive = false }
    compileOnly files(
            mekanismExtrasJar,
            mekenergisticsJar,
            ae2Jar,
            mekmmJar
    )
    // Recipe and mob-jar bridges use registry lookups/reflection so optional
    // implementation classes are not hard-linked into the addon.
    localRuntime files(
            "libs/Mekanism-1.21.1-${mekanism_version}.jar"
    )
    if (occultismRuntimeEnabled) {
        localRuntime files(
                "libs/occultism-1.21.1-neoforge-${occultism_version}.jar"
        )
    }
    if (arsRuntimeEnabled) {
        localRuntime files(
                "libs/ars_nouveau-1.21.1-${ars_nouveau_version}.jar"
        )
    }
    if (naturesAuraRuntimeEnabled) {
        localRuntime "maven.modrinth:natures-aura:${natures_aura_version}"
        localRuntime "vazkii.patchouli:Patchouli:${patchouli_version}"
    }
    if (forbiddenRuntimeEnabled) {
        localRuntime(forbiddenCoordinate) { transitive = false }
        localRuntime(valhelsiaCoordinate) { transitive = false }
    }
    if (mekExtrasRuntimeEnabled) {
        localRuntime files(
                "libs/mekanism_extras-1.21.1-${mekanism_extras_version}.jar"
        )
    }
    if (mekmmRuntimeEnabled) {
        localRuntime files(
                "libs/mekmm-1.21.1-${mekmm_runtime_version}.jar"
        )
    }
    if (mekEnergisticsRuntimeEnabled) {
        localRuntime files(mekenergisticsJar)
    }
    if (ae2RuntimeEnabled) {
        localRuntime files(ae2Jar)
    }
    if (arsEnergistiqueRuntimeEnabled) {
        if (!arsEnergistiqueJar.isFile()) {
            throw new GradleException('Ars Energistique runtime was enabled, '
                    + "but the jar is missing: ${arsEnergistiqueJar}")
        }
        localRuntime files(arsEnergistiqueJar)
    }
    if (project.findProperty('mekanism_magic.jade_runtime')?.toString()?.toBoolean()) {
        localRuntime("maven.modrinth:jade:${jade_maven_version}") { transitive = false }
    }
    if (project.findProperty('mekanism_magic.appflux_runtime')?.toString()?.toBoolean()) {
        localRuntime("maven.modrinth:appflux:${appflux_maven_version}") { transitive = false }
        localRuntime("maven.modrinth:glodium:${glodium_maven_version}") { transitive = false }
    }
    if (project.findProperty('mekanism_magic.packaged_faa_runtime')?.toString()?.toBoolean()) {
        // Immutable published versions. FishLib 1.0.6 is already bundled by PFAA.
        localRuntime('maven.modrinth:SRTE8mLr:mCPrTJSO') { transitive = false }
        localRuntime('maven.modrinth:ordsPcFz:pp2cY80Q') { transitive = false }
        localRuntime('maven.modrinth:ugIdhQx4:ErYy5Im9') { transitive = false }
    }

    // Keep the executable compatibility self-tests offline while still
    // compiling them against the same remapped game/API classpath as main.
    testCompileOnly files(sourceSets.main.compileClasspath)
    testRuntimeOnly files(sourceSets.main.runtimeClasspath)
    testRuntimeOnly("com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:${ars_nouveau_maven_version}") {
        transitive = false
    }
    testRuntimeOnly("mekanism:Mekanism:1.21.1-${mekanism_version}") {
        transitive = false
    }
    testRuntimeOnly "maven.modrinth:natures-aura:${natures_aura_version}"
    // Only the recipe API is needed for headless slot-contract tests, never a JEI client runtime.
    testRuntimeOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"

}

// Independent optional-mod matrices: these test classes never enter the JAR
// or the normal client. In particular, absent tests have no F&A runtime JAR.
sourceSets {
    forbiddenGameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.runtimeClasspath + configurations.forbiddenGameTestRuntimeClasspath
    }
    forbiddenAbsentGameTest {
        java.srcDir('src/forbiddenGameTest/java')
        java.include '**/ForbiddenAbsentGameTests.java', '**/RetiredEssenceMachineChunkGameTests.java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = (output + sourceSets.main.runtimeClasspath + configurations.forbiddenAbsentGameTestRuntimeClasspath).filter { entry ->
            def name = entry.name.toLowerCase(Locale.ROOT)
            !['forbidden-arcanus', 'valhelsia-core', 'packaged_faa', 'packagedfaa',
              'srte8mlr', 'ugidhqx4', 'ordspcfz'].any { name.contains(it) }
        }
    }
}
dependencies {
    forbiddenGameTestRuntimeOnly(forbiddenCoordinate) { transitive = false }
    forbiddenGameTestRuntimeOnly(valhelsiaCoordinate) { transitive = false }
}
neoForge {
    mods {
        "${mod_id}_forbidden_gametest" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.forbiddenGameTest)
        }
        "${mod_id}_forbidden_absent_gametest" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.forbiddenAbsentGameTest)
        }
    }
    runs {
        forbiddenGameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.forbiddenGameTest
            loadedMods = [mods."${mod_id}_forbidden_gametest"]
            gameDirectory = file('run-forbidden-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'minecraft'
        }
        forbiddenAbsentGameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.forbiddenAbsentGameTest
            loadedMods = [mods."${mod_id}_forbidden_absent_gametest"]
            gameDirectory = file('run-forbidden-absent-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'minecraft'
        }
    }
}

// Opt-in runtime GameTests for the real AE2 + Mek Energistics boundary.
// A mod-loader startup exception can exit the launcher with code zero.
// These isolated matrices require an actual, fresh positive test report.
['runForbiddenGameTestServer': 'run-forbidden-gametest',
 'runForbiddenAbsentGameTestServer': 'run-forbidden-absent-gametest'].each { taskName, directory ->
    tasks.named(taskName).configure {
        long startedAt
        doFirst { startedAt = System.currentTimeMillis() }
        doLast {
            File result = file("${directory}/logs/latest.log")
            if (!result.isFile() || result.lastModified() < startedAt
                    || !(result.getText('UTF-8') =~ /All [1-9][0-9]* required tests passed/).find()) {
                throw new GradleException("${taskName} did not complete a fresh passing GameTest run")
            }
        }
    }
}

// Opt-in runtime GameTests for the real AE2 + Mek Energistics boundary.
// They live outside main and are never included in the release jar. A clean
// CI checkout without the supplied optional integration jars simply omits
// this local-only run configuration.
if (compileMekEnergistics && compileAe2) {
    configurations {
        jeiGameTestApi {
            canBeConsumed = false
            canBeResolved = true
        }
    }
    // Standalone JEI API jars need a game-library manifest in NeoForge
    // 1.21.1. Boot-classpath libraries cannot see Minecraft MenuType classes.
    // This test-only wrapper contains the unchanged official API, never JEI UI.
    def jeiGameTestLibrary = tasks.register('prepareJeiGameTestApi', Jar) {
        archiveFileName = 'jei-api-gametest-library.jar'
        destinationDirectory = layout.buildDirectory.dir('tmp/jei-gametest-api')
        from({ configurations.jeiGameTestApi.collect { zipTree(it) } })
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        manifest { attributes 'FMLModType': 'GAMELIBRARY' }
    }
    def entityContainerTestJars = [
            'ApothicEnchanting-1.21.1-1.5.3.jar',
            'ApothicAttributes-1.21.1-2.9.1.jar',
            'Placebo-1.21.1-9.9.1.jar',
            'industrialforegoing-1.21-3.6.38.jar',
            'titanium-1.21-4.0.43.jar',
            'justdirethings-1.5.7.jar',
            'enderio-8.2.11-beta.jar'
    ].collect { file("libs/${it}") }
    sourceSets {
        gameTest {
            compileClasspath += sourceSets.main.output
            compileClasspath += sourceSets.main.compileClasspath
            // Do not leak main compileOnly integrations into the runtime:
            // several supplied reference jars are mutually incompatible.
            runtimeClasspath = output + sourceSets.main.runtimeClasspath
            runtimeClasspath += configurations.gameTestRuntimeClasspath
        }
    }

    sourceSets {
        nativeAeAbsentGameTest {
            java.srcDir('src/gameTest/java')
            java.include '**/NativeAeOptionalAbsenceGameTests.java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath = (output + sourceSets.main.runtimeClasspath + configurations.gameTestRuntimeClasspath).filter { entry ->
                def name = entry.name.toLowerCase(Locale.ROOT)
                !['appliedenergistics', 'mekenergistics', 'applied-mekanistics', 'arseng', 'appliedflux', 'jade'].any { name.contains(it) }
            }
        }
        machineNetworkGameTest {
            java.srcDir('src/gameTest/java')
            java.include '**/ImbuementCatalystPresenceGameTests.java',
                    '**/ArsImbuementFactoryCatalystPresenceGameTests.java',
                    '**/ArsImbuementContinuityGameTests.java',
                    '**/ArsCatalystFreeMachineGameTests.java',
                    '**/CatalystFreeImbuementAeGameTests.java',
                    '**/MachineAeResourceGameTests.java', '**/MekEnergisticsUpgradeEligibilityGameTests.java',
                    '**/JadeMachineDataGameTests.java',
                    '**/MachinePanelGameTests.java', '**/RetainedModuleGameTests.java',
                    '**/AuraGeneratorTypeSelectionGameTests.java',
                    '**/Ae2PatternEncodingTestSupport.java', '**/PatternEncodingMenuSmokeGameTests.java',
                    '**/Ae2AddonMachineJeiGameTests.java', '**/Ae2AuraBottleContainerGameTests.java',
                    '**/Ae2EssenceIntegrationGameTests.java', '**/MachineAeDirectExportGameTests.java',
                    '**/MachineAeOutputTransactionGameTests.java', '**/MachineAeFunctionControlsGameTests.java',
                    '**/Ae2AuraBottlingGameTests.java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath = output + sourceSets.main.runtimeClasspath + configurations.gameTestRuntimeClasspath
        }
        externalProviderGameTest {
            java.srcDir('src/gameTest/java')
            java.include '**/ExternalPatternProviderGameTests.java', '**/ExternalNaturePatternPlanningGameTests.java',
                    '**/AnimalSpawnerExternalPatternGameTests.java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath = output + sourceSets.main.runtimeClasspath + configurations.gameTestRuntimeClasspath
        }
        machineItemGameTest {
            java.srcDir('src/gameTest/java')
            java.include '**/MachineItemContainerGameTests.java', '**/RitualSpawnEggPersistenceGameTests.java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath = output + sourceSets.main.runtimeClasspath + configurations.gameTestRuntimeClasspath
        }
        entityContainerGameTest {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath = output + sourceSets.main.runtimeClasspath + configurations.gameTestRuntimeClasspath
            runtimeClasspath += files(entityContainerTestJars)
        }
        natureOnlyGameTest {
            java.srcDir('src/gameTest/java')
            java.include '**/MagicPipeAuraGameTests.java', '**/OfferingIntegrationGameTests.java', '**/NatureAuraIntegrationGameTests.java',
                    '**/TreeRitualIntegrationGameTests.java', '**/AnimalSpawnerIntegrationGameTests.java',
                    '**/InternalNatureTestSupport.java',
                    '**/NatureAltarExtrasGameTests.java', '**/Ae2AuraInterfaceGameTests.java',
                    '**/NatureAltarCatalystCatalogGameTests.java', '**/NatureAltarDynamicCatalystGameTests.java',
                    '**/FeAuraConverterGameTests.java', '**/AuraFuelGeneratorGameTests.java', '**/AuraGeneratorTypeSelectionGameTests.java',
                    '**/NatureMachineEnergyGameTests.java', '**/MachinePanelGameTests.java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath = output + sourceSets.main.runtimeClasspath + configurations.gameTestRuntimeClasspath
        }
        energyGameTest {
            java.srcDir('src/gameTest/java')
            java.include '**/NativeDimensionMinerRedstoneGameTests.java', '**/DrygmyRedstoneGameTests.java', '**/DrygmySpawnEggGameTests.java',
                    '**/ArsImbuementAutomationGameTests.java', '**/ArsImbuementContinuityGameTests.java', '**/MiniRitualCraftingGameTests.java',
                    '**/CatalystFreeImbuementAeGameTests.java', '**/ArsCatalystFreeMachineGameTests.java',
                    '**/ArsOccultEnergyProfileGameTests.java', '**/ArsOccultFactoryEnergyGameTests.java',
                    '**/SpiritJeiGroupingGameTests.java',
                    '**/NativeDimensionMinerSafetyGameTests.java', '**/DrygmyPersistenceGameTests.java',
                    '**/DrygmyFluidPersistenceGameTests.java', '**/NatureMachineEnergyGameTests.java',
                    '**/RetainedModuleGameTests.java', '**/MachinePanelGameTests.java'
            if (occultismRuntimeEnabled) {
                java.include '**/MiniPentacleCaptureGameTests.java'
            }
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath = output + sourceSets.main.runtimeClasspath + configurations.gameTestRuntimeClasspath
        }
        magicStorageGameTest {
            java.srcDir('src/gameTest/java')
            java.include '**/MagicStorageCellGameTests.java', '**/MagicStorageInterfaceNetworkGameTests.java',
                    '**/Ae2EssenceIntegrationGameTests.java', '**/MachineAeDirectExportGameTests.java',
                    '**/MachineAeOutputTransactionGameTests.java', '**/MachineAeFunctionControlsGameTests.java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath = output + sourceSets.main.runtimeClasspath + configurations.gameTestRuntimeClasspath
        }
    }

    def spiritGameTestSupportJars = [
            mekenergisticsJar,
            ae2Jar,
            file('run/mods/Applied-Mekanistics-1.6.3.jar'),
            file("run/mods/MekanismGenerators-1.21.1-${mekanism_version}.jar"),
            file('run/mods/curios-neoforge-9.5.1+1.21.1.jar'),
            file('run/mods/geckolib-neoforge-1.21.1-4.9.2.jar'),
            file('run/mods/guideme-21.1.17.jar'),
            file('run/mods/modonomicon-1.21.1-neoforge-1.120.4.jar'),
            file('run/mods/SmartBrainLib-neoforge-1.21.1-1.16.11.jar'),
            file('libs/mekanism_extras-1.21.1-1.4.1.jar'),
            file('libs/mekmm-1.21.1-1.4.0.jar')
    ].findAll { it.exists() }

    dependencies {
        // Native multiblock fixtures are test-only; main keeps Occultism optional.
        if (project.findProperty('mekanism_magic.harvest_test_mods')?.toString()?.toBoolean()) {
            def harvestTestJars = [
                    file('libs/earthmobsmod-1.21.1-19.3.0.jar'),
                    file('libs/bagus_lib-1.21.1-13.25.1.jar'),
                    file('libs/productivebees-1.21.1-13.13.5.jar')
            ]
            if (harvestTestJars.any { !it.exists() }) {
                throw new GradleException('Optional live-harvest tests require the supplied EarthMobs, Bagus Lib and ProductiveBees jars.')
            }
            gameTestRuntimeOnly files(harvestTestJars)
        }
        gameTestCompileOnly files("libs/occultism-1.21.1-neoforge-${occultism_version}.jar",
                'run/mods/modonomicon-1.21.1-neoforge-1.120.4.jar')
        // Interface-only JEI API for real terminal/handler validation on the
        // dedicated GameTest server; no client JEI mod is loaded there.
        jeiGameTestApi "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
        gameTestRuntimeOnly files(jeiGameTestLibrary)
        energyGameTestCompileOnly files("libs/occultism-1.21.1-neoforge-${occultism_version}.jar",
                'run/mods/modonomicon-1.21.1-neoforge-1.120.4.jar')
        gameTestRuntimeOnly files(spiritGameTestSupportJars)
        gameTestRuntimeOnly "maven.modrinth:natures-aura:${natures_aura_version}"
