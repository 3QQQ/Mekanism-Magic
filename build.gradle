tasks.register('validateForbiddenIntegrationBoundary') {
    group = 'verification'
    description = 'Checks pinned F&A ABI samples and confines optional implementation references.'
    inputs.files(configurations.forbiddenReference)
    inputs.files(sourceSets.main.allJava)
    inputs.property('forbiddenVersion', forbidden_arcanus_version)
    inputs.property('coreVersion', valhelsia_core_version)
    doLast {
        if (forbidden_arcanus_version != '2.6.1' || valhelsia_core_version != '1.1.5') {
            throw new GradleException('Update and verify the exact Forbidden ABI bridge before changing its versions')
        }
        def expected = [
                'maven.modrinth:forbidden-arcanus:fNjxgZPH': '8D5EF1557FCDD0BA9FE98C38458751BCBECB118C30924DAA6FBDEA0A54BF5785',
                'curse.maven:valhelsia-core-416935:6296775': '8364C248EA4B8975327BC6CC36478ECDC1567110A6C8A47CE6B43E648EDD1127'
        ]
        def artifacts = configurations.forbiddenReference.resolvedConfiguration.resolvedArtifacts
        if (artifacts.size() != 2) throw new GradleException('Expected precisely two pinned Forbidden reference artifacts')
        artifacts.each { artifact ->
            def id = artifact.moduleVersion.id.toString()
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString().toUpperCase(java.util.Locale.ROOT)
            if (expected[id] != digest) throw new GradleException("Unverified Forbidden ABI artifact: ${id}")
        }
        sourceSets.main.allJava.each { sourceFile ->
            def relative = project.relativePath(sourceFile).replace('\\', '/')
            def source = sourceFile.getText('UTF-8')
            if ((source.contains('com.stal111.forbidden_arcanus') || source.contains('net.valhelsia.'))
                    && !relative.contains('/integration/forbiddenarcanus/')) {
                throw new GradleException("Forbidden implementation reference escaped its optional module: ${relative}")
            }
        }
        logger.lifecycle('Forbidden ABI sample hashes and optional package boundary verified')
    }
}

