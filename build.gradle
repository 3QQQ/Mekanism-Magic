                    'com/example/mekanismmagic/integration/ae2/'
                            + 'Ae2ArsCompat.class',
                    'com/example/mekanismmagic/integration/ae2/'
                            + 'Ae2ArsSourceNetworkAccess.class',
                    'com/example/mekanismmagic/integration/ae2/'
                            + 'Ae2SourceInterfaceStorage.class',
                    'com/example/mekanismmagic/integration/ae2/'
                            + 'Ae2CompatMixinPlugin.class',
                    'com/example/mekanismmagic/integration/ae2/'
                            + 'Ae2NatureAltarPattern.class',
                    'com/example/mekanismmagic/integration/ae2/'
                            + 'Ae2NatureAltarJeiTransfer.class',
                    'com/example/mekanismmagic/integration/ae2/'
                            + 'Ae2NaturePatternCacheRefresher.class',
                    'com/example/mekanismmagic/integration/ae2/mixin/'
                            + 'Ae2NaturePatternDecoderMixin.class',
                    'com/example/mekanismmagic/integration/ae2/mixin/'
                            + 'Ae2NaturePatternProviderRefreshMixin.class',
                    'ae2_compat.mixins.json'
            ])
            [1, 4, 16, 64, 256].each { size ->
                requiredEntries.addAll([
                        "assets/mekanism_magic/models/item/magic_storage_cell_${size}k.json".toString(),
                        "assets/mekanism_magic/models/block/drive/magic_storage_cell_${size}k.json".toString(),
                        "data/mekanism_magic/recipe/magic_storage_cell_${size}k.json".toString()
                ])
            }
        }

        File jarFile = archive.get().asFile
        harvestDefinitions.each { definition ->
            requiredEntries.add('data/mekanism_magic/drygmy_harvest/'
                    + file('src/main/resources/data/mekanism_magic/drygmy_harvest')
                    .toPath().relativize(definition.toPath()).toString().replace('\\', '/'))
        }
        Set<String> packagedEntries = new HashSet<>()
        java.util.zip.ZipFile zip = new java.util.zip.ZipFile(jarFile)
        try {
            zip.entries().each { packagedEntries.add(it.name) }
            def retainedMixinEntry = zip.getEntry('mekanism_magic.mixins.json')
            if (retainedMixinEntry == null) throw new GradleException('Missing core mixin configuration')
            def retainedMixins = zip.getInputStream(retainedMixinEntry).withCloseable {
                new groovy.json.JsonSlurper().parse(it)
            }
            if (!retainedMixins.mixins.contains('RetainedSlotMixin')) {
                throw new GradleException('Retained sidebar Slot hook is not enabled in the packaged configuration')
            }
            def featureEntry = zip.getEntry('META-INF/mekanism_magic_features.properties')
            Properties features = new Properties()
            if (featureEntry == null) throw new GradleException('Missing packaged feature flags')
            zip.getInputStream(featureEntry).withCloseable { features.load(it) }
            if (features.getProperty('forbidden_arcanus_integration') != 'true') {
                throw new GradleException('Forbidden & Arcanus integration feature flag is missing or disabled')
            }
        } finally {
            zip.close()
        }
        List<String> missing = requiredEntries.findAll {
            !packagedEntries.contains(it)
        }
        if (packagedEntries.any { it.startsWith('com/stal111/') || it.startsWith('net/valhelsia/')
                || it.startsWith('data/forbidden_arcanus/') || it.startsWith('assets/forbidden_arcanus/')
                || it.startsWith('assets/valhelsia_core/') || it.startsWith('data/valhelsia_core/')
                || (it.endsWith('.jar') && (it.contains('forbidden') || it.contains('valhelsia'))) }) {
            throw new GradleException('Third-party Forbidden & Arcanus / Valhelsia contents must not be redistributed in this JAR')
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Packaged integration contract failed for ${jarFile.name}; "
                            + 'missing entries: ' + missing.join(', '))
        }
        if (['com/example/mekanismmagic/client/gui/GuiAeSupplyTab.class',
             'com/example/mekanismmagic/client/gui/GuiAeSideConfigControl.class',
             'com/example/mekanismmagic/client/gui/GuiAeConfigurationTab.class',
             'com/example/mekanismmagic/client/gui/GuiAeConfigurationWindow.class',
             'com/example/mekanismmagic/client/gui/AeConfigurationLayout.class',
             'com/example/mekanismmagic/client/gui/GuiThemeToggleTab.class',
             'com/example/mekanismmagic/mixin/client/GuiMachineAeConfigurationMixin.class',
             'com/example/mekanismmagic/integration/naturesaura/client/GuiAuraTypeModeButton.class',
             'com/example/mekanismmagic/integration/naturesaura/client/NatureAltarRecipeButton.class',
             'com/example/mekanismmagic/integration/ae2/Ae2AuraBottleRequestPayload.class',
             'com/example/mekanismmagic/integration/ae2/mixin/Ae2StorageMenuSerialAccessor.class',
             'com/example/mekanismmagic/integration/ae2/mixin/Ae2AuraBottleTerminalScreenMixin.class']
                .any { packagedEntries.contains(it) }) {
            throw new GradleException('Obsolete external AE tab or custom bottling packet/UI hooks must not be packaged')
        }
        if (packagedEntries.any { entry ->
            entry.startsWith('com/example/mekanismmagic/client/gui/MekIndustrialScreen')
                    || entry.startsWith('com/example/mekanismmagic/client/gui/GuiMekMachineReadout')
        }) {
            throw new GradleException('Canceled native-gray GUI implementation must not be packaged')
        }
        def retiredEssenceNames = ['SoulExtractorProcessor', 'SimulatedBloodExtractor', 'ExperienceBottler',
                                   'SoulExtraction261Bridge', 'SimulatedBlood261Bridge', 'PlayerExperienceMath']
        def retiredEssenceIds = ['soul_extractor_processor', 'simulated_blood_extractor', 'experience_bottler']
        if (packagedEntries.any { entry ->
            (entry.endsWith('.class') && retiredEssenceNames.any { entry.tokenize('/').last().startsWith(it) })
                    || (entry.endsWith('.json') && retiredEssenceIds.any { entry.tokenize('/').last() == it + '.json'
                    || entry.tokenize('/').last() == it + '_active.json' })
        }) {
            throw new GradleException('Retired independent essence machines must not be packaged; only registry migration aliases remain')
        }
    }
}

// A caller that explicitly requests a full-integration jar must not be able
// to bypass the archive contract by invoking `jar` without `check`.
if (requireFullIntegrations.get()) {
    tasks.named('jar') {
        finalizedBy tasks.named('validatePackagedIntegrations')
    }
}

tasks.named('check') {
    dependsOn tasks.named('validatePackagedIntegrations')
}
