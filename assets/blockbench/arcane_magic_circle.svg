    <path d="M64 45 L74 55 L82 64 L74 73 L64 83 L54 73 L46 64 L54 55 Z" stroke="#B457FF" stroke-width="2"/>
    <path d="M64 50 V78 M50 64 H78 M55 55 L73 73 M73 55 L55 73" stroke="#5CEBFF" stroke-width="1.7"/>
    <circle cx="64" cy="64" r="4" fill="#F7D26A" stroke="#FFF3B0" stroke-width="1"/>
