    <path d="M64 30 L98 64 L64 98 L30 64 Z" stroke="#B457FF" stroke-width="1.6"/>
    <path d="M64 39 L89 64 L64 89 L39 64 Z" stroke="#F7D26A" stroke-width="1.4"/>
