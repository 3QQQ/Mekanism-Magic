        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="outerRune" fill="none" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M64 5 L59 12 L64 19 L69 12 Z" stroke="#F7D26A" stroke-width="2"/>
      <path d="M60 12 H68 M64 8 V16" stroke="#5CEBFF" stroke-width="1.4"/>
    </g>
    <g id="radialGlyph" fill="none" stroke-linecap="square">
      <path d="M64 22 V31 M60 27 L64 23 L68 27" stroke="#B457FF" stroke-width="1.8"/>
      <circle cx="64" cy="33" r="1.8" fill="#5CEBFF" stroke="none"/>
    </g>
  </defs>

  <g fill="none" opacity="0.82">
    <circle cx="64" cy="64" r="58" stroke="#B97824" stroke-width="1.5"/>
    <circle cx="64" cy="64" r="54" stroke="#F7D26A" stroke-width="2.4"/>
    <circle cx="64" cy="64" r="48" stroke="#F7D26A" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="64" cy="64" r="39" stroke="#B457FF" stroke-width="2"/>
    <circle cx="64" cy="64" r="34" stroke="#5CEBFF" stroke-width="1" stroke-dasharray="2 4"/>

    <g opacity="0.98">
