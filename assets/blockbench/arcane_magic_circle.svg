      <use href="#outerRune" transform="rotate(45 64 64)"/>
      <use href="#outerRune" transform="rotate(90 64 64)"/>
      <use href="#outerRune" transform="rotate(135 64 64)"/>
      <use href="#outerRune" transform="rotate(180 64 64)"/>
      <use href="#outerRune" transform="rotate(225 64 64)"/>
      <use href="#outerRune" transform="rotate(270 64 64)"/>
      <use href="#outerRune" transform="rotate(315 64 64)"/>
    </g>

    <g opacity="0.95">
      <use href="#radialGlyph"/>
      <use href="#radialGlyph" transform="rotate(45 64 64)"/>
      <use href="#radialGlyph" transform="rotate(90 64 64)"/>
      <use href="#radialGlyph" transform="rotate(135 64 64)"/>
      <use href="#radialGlyph" transform="rotate(180 64 64)"/>
      <use href="#radialGlyph" transform="rotate(225 64 64)"/>
      <use href="#radialGlyph" transform="rotate(270 64 64)"/>
      <use href="#radialGlyph" transform="rotate(315 64 64)"/>
