org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.244
loader_version_range=[4,)

# Compile against the oldest supported dependency versions so the produced
# bytecode remains loadable on both the baseline and newer releases.
mekanism_version=10.7.19.85
occultism_version=1.222.0
ars_nouveau_version=5.13.0
ars_nouveau_maven_version=5.13.0.1389
geckolib_compile_version=4.6.6
jei_version=19.20.0.239
mekmm_runtime_version=1.3.3
mekanism_extras_version=1.4.0
natures_aura_version=41.9
forbidden_arcanus_version=2.6.1
forbidden_arcanus_maven_version=fNjxgZPH
valhelsia_core_version=1.1.5
valhelsia_core_curse_file=6296775
patchouli_version=1.21.1-92-NEOFORGE
ars_energistique_version=2.1.1-beta

mod_id=mekanism_magic
mod_name=Mekanism Magic
mod_license=MIT
# A.B.C = published release; A.B.C.D = unpublished development revision.
# Increment D only for a completed substantive mod runtime-code change.
# No code change means no version bump; resource packs use their own versions.
# Rebuilds, tests, tools and documentation never advance this value. See docs/VERSIONING.md.
mod_version=1.0.6fix
mod_group_id=com.example.mekanismmagic

# The supplied Mekanism Extras 1.4.0 + MoreMachine 1.4.0 pair currently
# throws a MatchException during its own startup integration. Keep them on
# the compile classpath for reference, but do not load them in runClient by
# default. Set this to true only for a compatible pair.
mekanism_magic.compat_runtime=false
mekanism_magic.occultism_runtime=true
mekanism_magic.mekextras_runtime=false
mekanism_magic.mekmm_runtime=false
# Ars Nouveau machines are part of the normal addon build. Keeping this true
# is required for stable registry IDs across game restarts and world reloads.
mekanism_magic.ars_machine_content=true

# Ars Nouveau stays opt-in for ordinary development launches so the default
# run remains dependency-minimal. The declared NeoForge 21.1.228 baseline is
# already newer than the 21.1.205 required by Ars Nouveau 5.13.0's Nuggets.
mekanism_magic.ars_runtime=false
# Nature's Aura and Forbidden & Arcanus integration content is excluded.
# Their pinned coordinates above are used only by verify_excluded_mods tests.
# Optional local runtime for validating AE Source storage and the ME Source
# Jar. Supply mekanism_magic.arseng_jar when the jar is outside libs/.
mekanism_magic.arseng_runtime=false
