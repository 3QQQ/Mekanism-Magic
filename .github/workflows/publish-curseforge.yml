name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
      publish_to_curseforge:
        description: Publish after validation (disabled for dry runs)
        required: true
        type: boolean
        default: false
      update_changelog_only:
        description: Update the existing 1.0.7 CF changelog without uploading a file
        required: false
        type: boolean
        default: false
      curseforge_file_id:
        description: Existing CurseForge file to update (1.0.7 only)
        required: false
        type: string
        default: '9283086'

permissions:
  contents: read

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && inputs.update_changelog_only != true) || (github.event_name == 'release' && github.event.release.prerelease == false)

    steps:
      - name: Resolve release target
        id: target
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == v*-forge-1.20.1 ]]; then
            echo "loader=forge" >> "$GITHUB_OUTPUT"
            echo "game_version=1.20.1" >> "$GITHUB_OUTPUT"
            echo "java_version=17" >> "$GITHUB_OUTPUT"
            mod_version="${RELEASE_TAG#v}"
            mod_version="${mod_version%-forge-1.20.1}"
          elif [[ "$RELEASE_TAG" == v*-neoforge-1.21.1 ]]; then
            echo "loader=neoforge" >> "$GITHUB_OUTPUT"
            echo "game_version=1.21.1" >> "$GITHUB_OUTPUT"
            echo "java_version=21" >> "$GITHUB_OUTPUT"
            mod_version="${RELEASE_TAG#v}"
            mod_version="${mod_version%-neoforge-1.21.1}"
          else
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            echo "Expected v<version>-forge-1.20.1 or " \
              "v<version>-neoforge-1.21.1" >&2
            exit 1
          fi
          if [[ -z "$mod_version" ]]; then
            echo "Release tag does not contain a mod version" >&2
            exit 1
          fi
          # Four-part versions are local development revisions, not releases.
          # Accept the existing 1.0.5fix tag at the version-format gate only.
          if [[ "$RELEASE_TAG" == *-neoforge-1.21.1 && ! "$mod_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$mod_version" != "1.0.5fix" ]]; then
            echo "Cannot publish development version: $mod_version" >&2
            echo "Advance the release version and remove its development revision first." >&2
            exit 1
          fi
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-forge-1.20.1 ]]; then
            echo "expected_jar=mekanism_magic-${mod_version}-forge-1.20.1.jar" \
              >> "$GITHUB_OUTPUT"
          else
            echo "expected_jar=mekanism_magic-${mod_version}-neoforge-1.21.1.jar" \
              >> "$GITHUB_OUTPUT"
          fi

      # Publish the exact artifact that was reviewed and attached to GitHub.
      # Rebuilding here previously produced a smaller NeoForge jar with the
      # binary-only AE/Mek Energistics/Mekanism Extras bridges omitted.
      - name: Download release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p build/libs
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.jar" \
            --dir build/libs
          # workflow_dispatch must publish the same full release notes as the release event.
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body --jq .body > build/release-changelog.md

      - name: Validate release asset
        shell: bash
        env:
          TARGET_LOADER: ${{ steps.target.outputs.loader }}
          TARGET_GAME_VERSION: ${{ steps.target.outputs.game_version }}
          EXPECTED_MOD_VERSION: ${{ steps.target.outputs.mod_version }}
          EXPECTED_JAR: ${{ steps.target.outputs.expected_jar }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one release jar, found ${#jars[@]}" >&2
            exit 1
          fi
          jar="${jars[0]}"
          if [[ "${jar##*/}" != "$EXPECTED_JAR" ]]; then
            echo "Unexpected release asset: ${jar##*/}" >&2
            echo "Expected: $EXPECTED_JAR" >&2
            exit 1
          fi
          unzip -Z1 "$jar" > build/release-entries.txt
          if [[ "$TARGET_LOADER" == "neoforge" ]]; then
            metadata_entry="META-INF/neoforge.mods.toml"
          else
            metadata_entry="META-INF/mods.toml"
          fi
          unzip -p "$jar" "$metadata_entry" \
            | tr -d '\r' > build/release-metadata.toml
          required_metadata=(
            'modId="mekanism_magic"'
            "version=\"$EXPECTED_MOD_VERSION\""
            "modId=\"$TARGET_LOADER\""
            'modId="minecraft"'
            "versionRange=\"[$TARGET_GAME_VERSION]\""
          )
          for line in "${required_metadata[@]}"; do
            if ! grep -Fxq "$line" build/release-metadata.toml; then
              echo "Release metadata does not match target: $line" >&2
              exit 1
            fi
          done
          if [[ "$TARGET_LOADER" == "neoforge" ]]; then
            required=(
              "META-INF/mekanism_magic_features.properties"
              "com/example/mekanismmagic/integration/occultism/OccultismRitualMachineMode.class"
              "com/example/mekanismmagic/integration/occultism/OccultismSpiritJobPolicy.class"
              "com/example/mekanismmagic/integration/occultism/OccultismSpiritPatternValidator.class"
              "com/example/mekanismmagic/integration/occultism/OccultismMachineItemIdentity.class"
              "com/example/mekanismmagic/integration/occultism/MiniPentacleCapture.class"
              "com/example/mekanismmagic/integration/occultism/MiniPentacleClaims.class"
              "com/example/mekanismmagic/integration/arsnouveau/ArsApparatusRecipeViews.class"
              "com/example/mekanismmagic/integration/arsnouveau/client/ArsApparatusJeiReagents.class"
              "com/example/mekanismmagic/integration/ae2/Ae2ExactMachineJeiTransfer.class"
              "com/example/mekanismmagic/integration/ae2/Ae2RitualJeiTransfer.class"
              "com/example/mekanismmagic/integration/ae2/Ae2ArsApparatusJeiTransfer.class"
              "com/example/mekanismmagic/integration/occultism/MiniPentacleDeployment.class"
              "com/example/mekanismmagic/integration/common/network/PatternAutomationRefreshHooks.class"
              "com/example/mekanismmagic/integration/pipez/PipezCompatMixinPlugin.class"
              "com/example/mekanismmagic/integration/jade/MekanismMagicJadePlugin.class"
              "com/example/mekanismmagic/integration/jade/MagicMachineJadeProvider.class"
              "com/example/mekanismmagic/integration/jade/MachineJadeData.class"
              "com/example/mekanismmagic/integration/common/network/MachineAeResourceHooks.class"
              "com/example/mekanismmagic/integration/ae2/Ae2MachineResourceProvider.class"
              "com/example/mekanismmagic/integration/ae2/Ae2MachineResourceAccess.class"
              "com/example/mekanismmagic/integration/ae2/Ae2AppliedFluxEnergySource.class"
              "com/example/mekanismmagic/integration/mekenergistics/MekEnergisticsUpgradeEligibility.class"
              "com/example/mekanismmagic/integration/mekenergistics/mixin/MekEnergisticsAeNodeHandoffMixin.class"
              "com/example/mekanismmagic/integration/mekenergistics/mixin/MekEnergisticsAeSupplyGateMixin.class"
              "com/example/mekanismmagic/integration/mekenergistics/mixin/MekEnergisticsRuntimeUpgradeOwnerMixin.class"
              "com/example/mekanismmagic/integration/mekenergistics/mixin/MekEnergisticsRuntimeTileAccessor.class"
              "com/example/mekanismmagic/integration/pipez/mixin/ItemPipeTypeMixin.class"
              "com/example/mekanismmagic/integration/arsnouveau/ArsSourceProductionMixinPlugin.class"
              "com/example/mekanismmagic/integration/arsnouveau/mixin/SourcelinkEventProductionMixin.class"
              "com/example/mekanismmagic/integration/arsnouveau/mixin/VolcanicProductionMixin.class"
              "com/example/mekanismmagic/integration/arsnouveau/mixin/MycelialProductionMixin.class"
              "com/example/mekanismmagic/integration/arsnouveau/mixin/VitalicProductionMixin.class"
              "com/example/mekanismmagic/integration/arsnouveau/mixin/AlchemicalProductionMixin.class"
              "com/example/mekanismmagic/integration/mekextras/MekanismExtrasSpiritFactories.class"
              "com/example/mekanismmagic/integration/mekextras/MekanismExtrasImbuementFactories.class"
              "com/example/mekanismmagic/integration/mekextras/MekanismExtrasNatureAltarFactories.class"
              "com/example/mekanismmagic/integration/mekextras/ExtraNatureAltarFactoryBlockEntity.class"
              "com/example/mekanismmagic/integration/ae2/Ae2ArsCompat.class"
              "com/example/mekanismmagic/integration/ae2/Ae2CompatMixinPlugin.class"
              "com/example/mekanismmagic/integration/ae2/Ae2NatureAltarPattern.class"
              "com/example/mekanismmagic/integration/ae2/Ae2NatureAltarJeiTransfer.class"
              "com/example/mekanismmagic/integration/ae2/Ae2NaturePatternCacheRefresher.class"
              "com/example/mekanismmagic/integration/ae2/mixin/Ae2NaturePatternDecoderMixin.class"
              "com/example/mekanismmagic/integration/ae2/mixin/Ae2NaturePatternProviderRefreshMixin.class"
              "com/example/mekanismmagic/integration/mekenergistics/MekEnergisticsCompat.class"
              "com/example/mekanismmagic/integration/mekenergistics/MekEnergisticsCompatMixinPlugin.class"
              "com/example/mekanismmagic/integration/mekenergistics/OccultismRitualMeRouter.class"
              "com/example/mekanismmagic/integration/mekenergistics/MekEnergisticsPendingPatternContext.class"
              "com/example/mekanismmagic/integration/mekenergistics/MekEnergisticsPendingRefund.class"
              "com/example/mekanismmagic/integration/mekenergistics/SpiritPatternMeRouter.class"
              "com/example/mekanismmagic/integration/mekenergistics/mixin/MekEnergisticsPendingPatternContextMixin.class"
              "com/example/mekanismmagic/integration/mekenergistics/mixin/MekEnergisticsNatureAltarPatternMixin.class"
              "com/example/mekanismmagic/integration/mekenergistics/mixin/MekEnergisticsNatureFactoryAutomationMixin.class"
              "com/example/mekanismmagic/integration/mekenergistics/mixin/MekEnergisticsTierInstallerStateMixin.class"
              "com/example/mekanismmagic/integration/mekenergistics/MekEnergisticsNaturePatternCacheRefresher.class"
              "com/example/mekanismmagic/integration/mekenergistics/mixin/MekEnergisticsNaturePatternCacheMixin.class"
              "com/example/mekanismmagic/integration/naturesaura/NaturesAuraContentModule.class"
              "com/example/mekanismmagic/integration/common/network/MagicPipeRegistries.class"
              "com/example/mekanismmagic/integration/naturesaura/MagicPipeAuraIntegration.class"
              "com/example/mekanismmagic/integration/naturesaura/MagicPipeAuraChannel.class"
              "com/example/mekanismmagic/integration/naturesaura/OfferingProcessorBlockEntity.class"
              "com/example/mekanismmagic/integration/naturesaura/TreeRitualProcessorBlockEntity.class"
              "com/example/mekanismmagic/integration/naturesaura/AnimalSpawnerProcessorBlockEntity.class"
              "com/example/mekanismmagic/integration/naturesaura/AnimalSpawnEggs.class"
              "com/example/mekanismmagic/integration/forbiddenarcanus/ForbiddenArcanusContentModule.class"
              "com/example/mekanismmagic/integration/forbiddenarcanus/ClibanoProcessorBlockEntity.class"
              "com/example/mekanismmagic/integration/forbiddenarcanus/HephaestusForgeProcessorBlockEntity.class"
              "com/example/mekanismmagic/integration/forbiddenarcanus/EssenceCondenserBlockEntity.class"
              "com/example/mekanismmagic/integration/ae2/storage/MagicStorageCells.class"
              "com/example/mekanismmagic/client/gui/GuiMachineSettingsWindow.class"
              "com/example/mekanismmagic/client/gui/GuiMachineProgress.class"
              "com/example/mekanismmagic/integration/naturesaura/NatureAltarContextItem.class"
              "com/example/mekanismmagic/integration/naturesaura/NatureAltarContextCountPolicy.class"
              "com/example/mekanismmagic/integration/naturesaura/NatureAltarLockedContextPolicy.class"
              "com/example/mekanismmagic/integration/naturesaura/NatureAltarFactoryLanePolicy.class"
              "com/example/mekanismmagic/integration/naturesaura/DynamicNaturalAuraView.class"
              "com/example/mekanismmagic/integration/naturesaura/NatureAltarFactoryBlockEntity.class"
              "com/example/mekanismmagic/integration/naturesaura/NaturalAuraMergeGuard.class"
              "com/example/mekanismmagic/integration/naturesaura/NaturalAuraPipeSemantics.class"
              "com/example/mekanismmagic/integration/naturesaura/client/NaturesAuraJeiIntegration.class"
              "pipez_compat.mixins.json"
              "ars_source_production.mixins.json"
              "ae2_compat.mixins.json"
              "mekenergistics_compat.mixins.json"
            )
            for entry in "${required[@]}"; do
              if ! grep -Fxq "$entry" build/release-entries.txt; then
                echo "Release jar is missing required integration: $entry" >&2
                exit 1
              fi
            done
          fi

      - name: Publish to CurseForge
        if: github.event_name == 'release' || inputs.publish_to_curseforge == true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/*.jar
          loaders: ${{ steps.target.outputs.loader }}
          game-versions: |
            ${{ steps.target.outputs.game_version }}
          java: ${{ steps.target.outputs.java_version }}
          version: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
          version-type: release
          name: Mekanism Magic ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
          changelog-file: build/release-changelog.md
          curseforge-dependencies: |
            mekanism(required)
            occultism(optional)
            ars-nouveau(optional)
            natures-aura(optional)
            forbidden-arcanus(optional)
            valhelsia-core(optional)
            packagedauto(optional)
            1502096(optional)
            jei(optional)
            applied-energistics-2(optional)
            mekanism-extras(optional)
            mekanism-more-machine(optional)
            mek-energistics(optional)
            905641(optional)
            extendedae(optional)
            pipez(optional)
            jade(optional)
            applied-flux(optional)

  update-changelog:
    name: Update existing CurseForge changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' && inputs.update_changelog_only == true
    steps:
      - name: Update only the existing file changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CF_API_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CF_FILE_ID: ${{ inputs.curseforge_file_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # This metadata-only operation is intentionally scoped to the released 1.0.7 file.
          [[ "$CF_PROJECT_ID" == "1660500" && "$CF_FILE_ID" == "9283086" && "$RELEASE_TAG" == "v1.0.7-neoforge-1.21.1" ]]
          test -n "$CF_API_TOKEN"
          mkdir -p build
          gh api "repos/$GITHUB_REPOSITORY/contents/docs/RELEASE_NOTES_1.0.7_CF.md?ref=$GITHUB_SHA" \
            --jq .content | base64 --decode > build/cf-changelog.md
          [[ "$(grep -c '^## English$' build/cf-changelog.md)" == "1" ]]
          [[ "$(grep -c '^## 中文$' build/cf-changelog.md)" == "1" ]]
          english_line="$(grep -n '^## English$' build/cf-changelog.md | cut -d: -f1)"
          chinese_line="$(grep -n '^## 中文$' build/cf-changelog.md | cut -d: -f1)"
          [[ "$english_line" -lt "$chinese_line" ]]
          jq -n --argjson fileID "$CF_FILE_ID" --rawfile changelog build/cf-changelog.md \
            '{fileID: $fileID, changelog: $changelog, changelogType: "markdown"}' > build/cf-changelog-metadata.json
          # Official Project File Management API: no file part and no other metadata fields.
          sha256sum build/cf-changelog.md
          if ! curl --fail-with-body --silent --show-error --max-time 90 --request POST \
            --header "X-Api-Token: $CF_API_TOKEN" \
            --form "metadata=<build/cf-changelog-metadata.json" \
            "https://minecraft.curseforge.com/api/projects/$CF_PROJECT_ID/update-file" \
            > build/cf-changelog-response.json; then
            # Show only public error messages/titles, never request headers or tokens.
            python3 - <<'PY'
          import json, re
          from pathlib import Path
          text = Path("build/cf-changelog-response.json").read_text(errors="replace")
          try:
              obj = json.loads(text)
              print(json.dumps({key: obj[key] for key in ("message", "error", "errorCode") if key in obj}, ensure_ascii=False)[:1000])
          except (ValueError, TypeError):
              print("Response titles:", re.findall(r"<(?:title|h1|h2)[^>]*>(.*?)</(?:title|h1|h2)>", text, re.I | re.S)[:4])
          PY
            exit 1
          fi
          jq -e --argjson expected "$CF_FILE_ID" '.id == $expected' build/cf-changelog-response.json
          printf 'Updated changelog on existing CurseForge file %s; no JAR uploaded.\n' "$CF_FILE_ID"
          sha256sum build/cf-changelog.md
